<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!--Nombre de la pagina-->
    <title>CyberNet - Login</title>
    <!--Pagina adaptable al dispositivo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Texto resumen de la pagina-->
    <meta name="description" content="Descripción del CyberCafé">
    <!--Evita duplicación-->
    <link rel="canonical" href="index.html">
    <!--Conecta el HTML con el CSS que se hará-->
    <link rel="stylesheet" href="style.css">

    <!-- Cargar la logica antes de alpine para evitar errores de lectura -->
    <script src="login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body x-data="loginForm()">

    <main class="contenedor-login">

        <div class="login-card">
            <div class="login-header">
                <img src="img/Logo.jpg" alt="logo CyberNet">
            </div>

            <section class="login-formulario">
                <h2>Acceso CyberNet</h2>
                <p>Ingresa tus datos</p>

                <!-- Aqui cambiamos id por @submit.prevent de Alpine -->
                <form @submit.prevent="iniciarSesion()">
                    <div class="grupo-input">
                        <label for="usuario">Usuario:</label>
                        <!-- Agregado el x-model para vincular el input con js -->
                        <input type="text" id="usuario" x-model="inputUsuario" placeholder="Ej: admin" required>
                    </div>

                    <div class="grupo-input">
                        <label for="password">Contraseña:</label>
                        <!-- Agregado el x-model para vincular el input con js -->
                        <input type="password" id="password" x-model="inputPassword" placeholder="********" required>
                    </div>
                    <br>
                    <button type="submit" class="btn-primario">Iniciar Sesión</button>
                </form>
                <br>
                <p>¿No estas registrado? <a href="registro.html" style="color: #977b61; font-weight: bold;">Crear cuenta aquí</a></p>
                <br>
                <a href="index.html" class="link-volver"> Inicio</a>
            </section>
        </div>

    </main>

</body>
</html>
